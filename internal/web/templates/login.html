{{define "content"}}
<form class="card login" method="post" action="/admin/login">
  <h1><svg class="logo-mark" aria-hidden="true"><use href="#i-logo"/></svg>MMP</h1>
  <p class="muted">Sign in to manage your channels and customers.</p>
  {{with .Data.Error}}<p class="error" role="alert">{{.}}</p>{{end}}
  <input type="hidden" name="next" value="{{.Data.Next}}">
  <label>Username
    <input name="username" autocomplete="username" value="{{.Data.Username}}" required {{if not .Data.Username}}autofocus{{end}}>
  </label>
  <label>Password
    <input name="password" type="password" autocomplete="current-password" required {{if .Data.Username}}autofocus{{end}}>
  </label>
  <button type="submit">Sign in</button>
</form>
{{end}}
