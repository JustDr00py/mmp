services:
  postgres:
    image: docker.io/library/postgres:17-alpine
    environment:
      POSTGRES_USER: mmp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (see .env.example)}
      POSTGRES_DB: mmp
    # Only this machine can reach Postgres (for local development and tests).
    ports:
      - "127.0.0.1:${MMP_POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mmp -d mmp"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  mmp:
    # Production: pull this released image (set MMP_IMAGE in .env to pin a
    # version) and start with --no-build. Development: `up -d --build` builds
    # it from source instead.
    image: ${MMP_IMAGE:-ghcr.io/justdr00py/mmp:latest}
    build:
      context: .
      # Variant with ffmpeg on board for transcode profiles and the prober:
      # target: mmp-ffmpeg
      args:
        VERSION: dev
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      MMP_DB_DSN: postgres://mmp:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/mmp?sslmode=disable
      MMP_BASE_URL: ${MMP_BASE_URL:-http://localhost:8080}
      # Automatic matching: these only seed the first start; after that the
      # admin UI's Settings page is in charge and changes here are ignored.
      # After each provider refresh, add new matching streams to existing
      # channels as extra failover; never create channels on its own.
      MMP_MATCH_AUTO: ${MMP_MATCH_AUTO:-true}
      MMP_MATCH_AUTO_NEW_CHANNELS: ${MMP_MATCH_AUTO_NEW_CHANNELS:-false}
      # With new channels on: their group (source = named after the provider
      # group, none, or a name) and bouquets (blank/auto = those most of the
      # group's channels are in, none, or comma-separated names).
      MMP_MATCH_AUTO_GROUP: ${MMP_MATCH_AUTO_GROUP:-source}
      MMP_MATCH_AUTO_BOUQUETS: ${MMP_MATCH_AUTO_BOUQUETS:-}
      # First admin, created only when none exists (values from .env):
      MMP_ADMIN_USERNAME: ${MMP_ADMIN_USERNAME:-}
      MMP_ADMIN_PASSWORD: ${MMP_ADMIN_PASSWORD:-}
      # A reverse proxy (Caddy, nginx) whose X-Forwarded-For MMP believes.
      # For one on this host proxying to localhost:<port>, the gateway of
      # the network below (172.28.0.1 by default). Blank: none.
      MMP_HTTP_TRUSTED_PROXIES: ${MMP_HTTP_TRUSTED_PROXIES:-}
      # Private or local addresses MMP may fetch from (a provider on your LAN).
      # Blank: none; every other private address is refused.
      MMP_UPSTREAM_ALLOW_CIDRS: ${MMP_UPSTREAM_ALLOW_CIDRS:-}
      # Time zone for log timestamps and the times the admin UI shows.
      TZ: ${TZ:-UTC}
      # How long an HLS player may go without requesting before it counts
      # as gone (frees its connection slot and the provider connection).
      MMP_HLS_IDLE_TIMEOUT: ${MMP_HLS_IDLE_TIMEOUT:-30s}
      # Most an HLS channel holds back to play provider bursts at real-time
      # speed (0 = off).
      MMP_HLS_BACKLOG: ${MMP_HLS_BACKLOG:-30s}
      # No stream data for this long → fail over. Providers that send in
      # bursts need it above their gaps, or working streams keep failing over.
      MMP_PROXY_STALL_TIMEOUT: ${MMP_PROXY_STALL_TIMEOUT:-12s}
    # Backups made from the admin UI (Settings → Backups) live here.
    volumes:
      - backups:/var/lib/mmp/backups
    # MMP_HTTP_BIND=127.0.0.1 publishes MMP to this host only (behind a
    # reverse proxy here); blank publishes it on every interface.
    ports:
      - "${MMP_HTTP_BIND:+${MMP_HTTP_BIND}:}${MMP_HTTP_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped

# A fixed subnet, so the gateway a reverse proxy on this host connects
# from (the subnet's .1) survives `down`/`up`. Change it only if it clashes
# with a network you use.
networks:
  default:
    ipam:
      config:
        - subnet: ${MMP_SUBNET:-172.28.0.0/24}

volumes:
  pgdata:
  backups:
