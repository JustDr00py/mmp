services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: mmp
      POSTGRES_PASSWORD: mmp
      POSTGRES_DB: mmp
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mmp -d mmp"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  mmp:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      MMP_DB_DSN: postgres://mmp:mmp@postgres:5432/mmp?sslmode=disable
      MMP_BASE_URL: http://localhost:8080
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  pgdata:
