name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call: # the release workflow runs the same checks first

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20 # a run takes about 5; a hang should not take GitHub's 6 hours
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: mmp
          POSTGRES_PASSWORD: mmp
          POSTGRES_DB: mmp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mmp -d mmp"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      # Integration tests fail (instead of skipping) if this server is unusable.
      MMP_TEST_PG: postgres://mmp:mmp@localhost:5432
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Tools used by some tests
        # Ubuntu's mirrors sometimes hang: each attempt gets two minutes, then
        # it tries again.
        timeout-minutes: 8
        run: |
          for i in 1 2 3; do
            sudo timeout 120 apt-get -o Acquire::Retries=3 update -qq &&
              sudo timeout 240 apt-get -o Acquire::Retries=3 install -y -qq ffmpeg libxml2-utils >/dev/null && exit 0
            echo "apt attempt $i failed; retrying" >&2
            sleep 5
          done
          exit 1
      - name: Lint
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
          go vet ./...
          go run honnef.co/go/tools/cmd/staticcheck@latest ./...
      - name: Unit tests
        run: go test -race ./...
      - name: Integration tests
        run: go test -race -p 1 -tags=integration ./...
