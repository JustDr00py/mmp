name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call: # the release workflow runs the same checks first

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25 # a run takes about 5; a hang should not take GitHub's 6 hours
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: mmp
          POSTGRES_PASSWORD: mmp
          POSTGRES_DB: mmp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mmp -d mmp"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      # Integration tests fail (instead of skipping) if this server is unusable.
      MMP_TEST_PG: postgres://mmp:mmp@localhost:5432
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Tools used by some tests
        # Installs here have hung past their time limit on every mirror. The
        # runner rebuilding its man-page index after an install can take
        # minutes, so that is turned off; apt waits at most a minute for
        # another apt's lock; a stalled download is dropped after 20 seconds;
        # attempts after the first use archive.ubuntu.com. A failed attempt
        # prints what apt and dpkg were doing.
        timeout-minutes: 12
        run: |
          echo 'man-db man-db/auto-update boolean false' | sudo debconf-set-selections
          sudo rm -f /var/lib/man-db/auto-update
          apt_opts="-o Acquire::Retries=5 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 -o DPkg::Lock::Timeout=60"
          for i in 1 2 3; do
            sudo timeout 90 apt-get $apt_opts update -q &&
              sudo timeout 150 apt-get $apt_opts install -y -q --no-install-recommends ffmpeg libxml2-utils && exit 0
            echo "::warning::apt attempt $i failed; still running:"
            ps -eo pid,etime,args | grep -E 'apt|dpkg|man-db|mandb|unattended' | grep -v grep || true
            sudo tail -n 20 /var/log/apt/term.log 2>/dev/null || true
            sudo dpkg --configure -a || true
            sudo sed -i 's|http://azure.archive.ubuntu.com|http://archive.ubuntu.com|g' \
              /etc/apt/sources.list.d/ubuntu.sources /etc/apt/sources.list 2>/dev/null || true
            sleep 5
          done
          exit 1
      - name: Lint
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
          go vet ./...
          go run honnef.co/go/tools/cmd/staticcheck@latest ./...
      - name: Unit tests
        run: go test -race ./...
      - name: Integration tests
        run: go test -race -p 1 -tags=integration ./...
