name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call: # the release workflow runs the same checks first

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25 # a run takes about 5; a hang should not take GitHub's 6 hours
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: mmp
          POSTGRES_PASSWORD: mmp
          POSTGRES_DB: mmp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mmp -d mmp"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      # Integration tests fail (instead of skipping) if this server is unusable.
      MMP_TEST_PG: postgres://mmp:mmp@localhost:5432
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # ffmpeg from apt meant 88 packages (62 MB) from the runner's Ubuntu
      # mirror, which at times crawls at tens of KB/s and failed runs however
      # it was retried. A static build from GitHub releases downloads fast and
      # is cached between runs. BtbN keeps only the newest release branches,
      # so master is the fallback when the pinned one is gone.
      - name: Cache ffmpeg
        id: ffmpeg-cache
        uses: actions/cache@v4
        with:
          path: ~/ffmpeg
          key: ffmpeg-static-n8.1-linux64
      - name: Download ffmpeg
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        timeout-minutes: 5
        run: |
          base=https://github.com/BtbN/FFmpeg-Builds/releases/download/latest
          mkdir -p ~/ffmpeg
          for asset in ffmpeg-n8.1-latest-linux64-gpl-8.1 ffmpeg-master-latest-linux64-gpl; do
            curl -fsSL --retry 3 "$base/$asset.tar.xz" |
              tar -xJ -C ~/ffmpeg --strip-components=2 --wildcards '*/bin/ffmpeg' '*/bin/ffprobe' && break
          done
          test -x ~/ffmpeg/ffmpeg && test -x ~/ffmpeg/ffprobe
      - name: Tools used by some tests
        # xmllint is a single small package, so the slow mirror matters little.
        timeout-minutes: 5
        run: |
          echo "$HOME/ffmpeg" >> "$GITHUB_PATH"
          "$HOME/ffmpeg/ffmpeg" -hide_banner -version | head -n 1
          if ! command -v xmllint >/dev/null; then
            echo 'man-db man-db/auto-update boolean false' | sudo debconf-set-selections
            sudo rm -f /var/lib/man-db/auto-update
            apt_opts="-o Acquire::Retries=5 -o DPkg::Lock::Timeout=60"
            sudo apt-get $apt_opts update -q
            sudo apt-get $apt_opts install -y -q --no-install-recommends libxml2-utils
          fi
      - name: Lint
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
          go vet ./...
          go run honnef.co/go/tools/cmd/staticcheck@latest ./...
      - name: Unit tests
        run: go test -race ./...
      - name: Integration tests
        run: go test -race -p 1 -tags=integration ./...
